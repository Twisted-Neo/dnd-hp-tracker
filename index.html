<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neo Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 relative pb-28">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-600 to-amber-600 flex items-center justify-center text-white shadow-lg shadow-red-950/50">
                    <i class="fas fa-shield-cat text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-white leading-none">Neo Tools</h1>
                    <p class="text-[11px] font-medium text-slate-400 mt-0.5">D&D tools made by Neo Nieminen</p>
                </div>
            </div>

            <!-- Sync & Account Actions -->
            <div class="flex items-center gap-2">
                <div id="sync-status" class="flex items-center text-xs text-amber-400 bg-slate-800/90 px-2.5 py-1 rounded-full border border-slate-700 font-medium">
                    <i class="fas fa-cloud-arrow-up mr-1.5"></i> Connecting...
                </div>
                <button id="user-menu-btn" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300 transition-colors">
                    <i class="fas fa-user text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full px-4 pt-5 pb-8">
        
        <!-- Account Status Banner -->
        <div id="auth-banner" class="hidden mb-4 p-3 bg-amber-950/40 border border-amber-800/50 rounded-xl flex items-center justify-between text-xs text-amber-200">
            <div class="flex items-center gap-2">
                <i class="fas fa-circle-exclamation text-amber-400 text-sm"></i>
                <span>Running in Guest mode. Sign in to sync across devices.</span>
            </div>
            <button id="banner-login-btn" class="font-bold underline hover:text-white shrink-0 ml-2">Sign In</button>
        </div>

        <!-- VIEW: ItemHP -->
        <div id="view-itemhp">
            <div id="items-container" class="flex flex-col gap-3.5">
                <div id="loading-state" class="text-center text-slate-500 py-16 flex flex-col items-center">
                    <i class="fas fa-dice-d20 fa-spin text-4xl mb-3 text-red-500/80"></i>
                    <p class="font-medium">Syncing campaign database...</p>
                </div>
            </div>
        </div>

        <!-- VIEW: Spell Circle -->
        <div id="view-spellcircle" class="hidden">
            <div class="card-panel flex flex-col items-center mb-6">
                <h2 class="text-sm font-bold text-slate-300 mb-2 uppercase tracking-widest">Draw Combination</h2>
                
                <!-- Drawing Canvas -->
                <div id="spell-canvas-container" class="relative w-[260px] h-[260px] my-2 bg-slate-950 rounded-full border border-slate-800 shadow-inner">
                    <svg id="spell-lines" class="absolute inset-0 w-full h-full pointer-events-none z-10"></svg>
                    <!-- Dots will be injected here via JS -->
                </div>

                <button id="btn-clear-spell" class="btn-secondary text-xs font-bold py-1 px-3 border border-slate-800 hover:border-slate-600 mt-3">
                    <i class="fas fa-rotate-left mr-1"></i> Clear Pattern
                </button>
            </div>

            <!-- Save Combination Form -->
            <form id="spell-form" class="card-panel mb-8">
                <h3 class="text-sm font-bold text-white mb-3">Save Combination</h3>
                <div class="flex flex-col gap-3">
                    <input type="text" id="spell-name" required placeholder="Spell Name (e.g. Fireball)" class="form-input">
                    <textarea id="spell-desc" required placeholder="Effect Description..." class="form-textarea resize-none h-20"></textarea>
                    <button type="submit" id="btn-save-spell" disabled class="btn-primary">
                        Save Pattern
                    </button>
                </div>
            </form>

            <!-- Saved Combinations List -->
            <div>
                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-3 px-1">Saved Spells</h3>
                <div id="saved-spells-container" class="flex flex-col gap-3">
                    <!-- Spells injected here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-slate-900/95 backdrop-blur-md border-t border-slate-800 z-30 pb-safe">
        <div class="max-w-md mx-auto flex justify-evenly items-center h-16">
            <button id="tab-itemhp" class="flex-1 h-full flex flex-col items-center justify-center text-red-400 font-bold border-t-2 border-red-500 transition-colors">
                <i class="fas fa-shield-cat text-lg mb-1"></i>
                <span class="text-[10px] uppercase tracking-wider">ItemHP</span>
            </button>
            <button id="tab-spellcircle" class="flex-1 h-full flex flex-col items-center justify-center text-slate-500 hover:text-slate-300 font-bold border-t-2 border-transparent transition-colors">
                <i class="fas fa-circle-nodes text-lg mb-1"></i>
                <span class="text-[10px] uppercase tracking-wider">Spell Circle</span>
            </button>
        </div>
    </nav>

    <!-- Floating Action Button -->
    <button id="fab-add" class="fixed bottom-20 right-6 lg:right-auto lg:left-1/2 lg:ml-[150px] w-14 h-14 bg-gradient-to-tr from-red-700 to-red-500 hover:from-red-600 hover:to-red-400 text-white rounded-2xl shadow-xl shadow-red-950/80 flex justify-center items-center text-2xl transition-all duration-200 active:scale-95 z-40 border border-red-400/30">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Authentication Modal -->
    <div id="auth-modal" class="fixed inset-0 modal-overlay z-[60] hidden flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4">
        <div class="modal-card">
            <button id="auth-modal-close" class="modal-close-btn"><i class="fas fa-xmark text-lg"></i></button>
            <div id="auth-user-info" class="hidden text-left py-2">
                <div class="text-center mb-4">
                    <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3 border border-slate-700">
                        <i class="fas fa-user-shield text-2xl text-red-400"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1">Account Settings</h3>
                    <p id="user-email-display" class="text-xs text-slate-400 font-mono"></p>
                </div>
                <div class="flex flex-col gap-4 border-t border-slate-800 pt-4">
                    <div>
                        <label class="form-label">Update Email</label>
                        <form id="form-update-email" class="flex gap-2">
                            <input type="email" id="input-update-email" required class="form-input text-xs py-2 px-3" placeholder="New email address">
                            <button type="submit" class="btn-secondary text-xs font-bold px-3 py-2 border border-slate-700 shrink-0">Update</button>
                        </form>
                    </div>
                    <div>
                        <label class="form-label">Change Password</label>
                        <form id="form-update-password" class="flex gap-2">
                            <input type="password" id="input-update-password" required minlength="6" class="form-input text-xs py-2 px-3" placeholder="New password">
                            <button type="submit" class="btn-secondary text-xs font-bold px-3 py-2 border border-slate-700 shrink-0">Change</button>
                        </form>
                    </div>
                    <div class="border-t border-slate-800 pt-4 flex flex-col gap-2.5">
                        <button id="btn-logout" class="btn-secondary w-full border border-slate-700 font-bold py-2.5 text-xs flex items-center justify-center">
                            <i class="fas fa-right-from-bracket mr-2"></i> Sign Out
                        </button>
                        <button id="btn-delete-account" class="w-full bg-red-950/60 hover:bg-red-900/80 text-red-400 border border-red-800/80 font-bold py-2.5 rounded-xl transition-colors text-xs flex items-center justify-center">
                            <i class="fas fa-user-xmark mr-2"></i> Delete Account
                        </button>
                    </div>
                </div>
            </div>

            <div id="auth-form-container">
                <div class="flex border-b border-slate-800 mb-5">
                    <button id="tab-login" class="flex-1 pb-3 text-center font-bold text-red-400 border-b-2 border-red-500">Sign In</button>
                    <button id="tab-register" class="flex-1 pb-3 text-center font-bold text-slate-500 hover:text-slate-300">Register</button>
                </div>
                <form id="auth-form" class="flex flex-col gap-4">
                    <div>
                        <label class="form-label">Email Address</label>
                        <input type="email" id="auth-email" required class="form-input" placeholder="adventurer@realm.com">
                    </div>
                    <div>
                        <label class="form-label">Password</label>
                        <input type="password" id="auth-password" required minlength="6" class="form-input" placeholder="••••••••">
                    </div>
                    <button type="submit" id="auth-submit-btn" class="btn-primary mt-2">
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Item Modal -->
    <div id="item-modal" class="fixed inset-0 modal-overlay z-[60] hidden flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4">
        <div class="modal-card">
            <button id="modal-close" class="modal-close-btn">
                <i class="fas fa-xmark text-lg"></i>
            </button>
            <h2 class="text-lg font-bold text-white mb-4" id="modal-title">Track New Item</h2>
            <form id="item-form" class="flex flex-col gap-4">
                <div>
                    <label class="form-label">Item or Creature Name</label>
                    <input type="text" id="input-name" required class="form-input" placeholder="e.g. Shield of Faith...">
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="form-label">Current HP</label>
                        <input type="number" id="input-current-hp" required class="form-input" placeholder="0">
                    </div>
                    <div class="flex-1">
                        <label class="form-label">Max HP</label>
                        <input type="number" id="input-max-hp" required class="form-input" placeholder="0">
                    </div>
                </div>
                <div>
                    <label class="form-label">Accent Color</label>
                    <input type="color" id="input-color" value="#3b82f6" class="w-full h-10 rounded-xl cursor-pointer">
                </div>
                <div class="border-t border-slate-800 pt-4 mt-1">
                    <div class="flex justify-between items-center mb-3">
                        <label class="form-label !mb-0">Item Properties</label>
                        <button type="button" id="btn-add-property" class="text-xs text-red-400 hover:text-red-300 font-bold flex items-center gap-1">
                            <i class="fas fa-plus"></i> Add Property
                        </button>
                    </div>
                    <div id="properties-editor-list" class="flex flex-col gap-2.5"></div>
                </div>
                <button type="submit" class="btn-primary mt-3">
                    Save Item
                </button>
            </form>
        </div>
    </div>

    <!-- Property Modal -->
    <div id="property-modal" class="fixed inset-0 modal-overlay z-[70] hidden flex flex-col justify-center items-center p-4">
        <div class="bg-slate-900 w-full max-w-xs rounded-2xl p-5 shadow-2xl border border-slate-800 relative transform transition-all">
            <button id="property-modal-close" class="modal-close-btn !top-3 !right-3">
                <i class="fas fa-xmark text-lg"></i>
            </button>
            <div class="flex items-center gap-3 mb-3">
                <div id="prop-display-icon" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-red-400 text-lg">
                    <i class="fas fa-wand-magic-sparkles"></i>
                </div>
                <h3 id="prop-display-title" class="text-base font-bold text-white leading-snug">Property Title</h3>
            </div>
            <p id="prop-display-desc" class="text-sm text-slate-300 leading-relaxed bg-slate-950 p-3 rounded-xl border border-slate-800/80"></p>
        </div>
    </div>

    <!-- Amount Modal -->
    <div id="amount-modal" class="fixed inset-0 modal-overlay z-[60] hidden flex flex-col justify-center items-center p-4">
        <div class="bg-slate-900 w-full max-w-xs rounded-2xl p-6 shadow-2xl border border-slate-800">
            <h3 id="amount-modal-title" class="text-lg font-bold mb-4 text-white text-center">Modify HP</h3>
            <input type="number" id="amount-input" class="form-input text-center text-2xl font-bold mb-5" placeholder="0" min="1">
            <div class="flex gap-2.5">
                <button id="amount-cancel" class="btn-secondary flex-1 text-sm">Cancel</button>
                <button id="amount-confirm" class="btn-primary flex-1 text-sm py-3 shadow-none">Confirm</button>
            </div>
        </div>
    </div>

    <div id="error-toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-950 border border-red-800 text-red-200 px-4 py-2.5 rounded-xl shadow-xl z-[100] hidden opacity-0 transition-opacity flex items-center gap-2 text-xs font-semibold">
        <i class="fas fa-triangle-exclamation text-red-400"></i>
        <span id="error-message"></span>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
