<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loot & Life - D&D HP Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 relative pb-28">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-30 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-red-600 to-amber-600 flex items-center justify-center text-white shadow-lg shadow-red-950/50">
                    <i class="fas fa-shield-cat text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-white leading-none">Loot & Life</h1>
                    <p class="text-[11px] font-medium text-slate-400 mt-0.5">D&D HP & Trait Tracker</p>
                </div>
            </div>

            <!-- Sync & Account Actions -->
            <div class="flex items-center gap-2">
                <div id="sync-status" class="flex items-center text-xs text-amber-400 bg-slate-800/90 px-2.5 py-1 rounded-full border border-slate-700 font-medium">
                    <i class="fas fa-cloud-arrow-up mr-1.5"></i> Connecting...
                </div>
                <button id="user-menu-btn" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300 transition-colors">
                    <i class="fas fa-user text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full px-4 pt-5">
        <!-- Account Status Banner -->
        <div id="auth-banner" class="hidden mb-4 p-3 bg-amber-950/40 border border-amber-800/50 rounded-xl flex items-center justify-between text-xs text-amber-200">
            <div class="flex items-center gap-2">
                <i class="fas fa-circle-exclamation text-amber-400 text-sm"></i>
                <span>Running in Guest mode. Sign in to sync across devices.</span>
            </div>
            <button id="banner-login-btn" class="font-bold underline hover:text-white shrink-0 ml-2">Sign In</button>
        </div>

        <!-- Items List -->
        <div id="items-container" class="flex flex-col gap-3.5">
            <!-- Loading State -->
            <div id="loading-state" class="text-center text-slate-500 py-16 flex flex-col items-center">
                <i class="fas fa-dice-d20 fa-spin text-4xl mb-3 text-red-500/80"></i>
                <p class="font-medium">Syncing campaign database...</p>
            </div>
        </div>
    </main>

    <!-- Floating Action Button -->
    <button id="fab-add" class="fixed bottom-6 right-6 lg:right-auto lg:left-1/2 lg:ml-[150px] w-14 h-14 bg-gradient-to-tr from-red-700 to-red-500 hover:from-red-600 hover:to-red-400 text-white rounded-2xl shadow-xl shadow-red-950/80 flex justify-center items-center text-2xl transition-all duration-200 active:scale-95 z-40 border border-red-400/30">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Authentication Modal -->
    <div id="auth-modal" class="fixed inset-0 modal-overlay z-50 hidden flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4">
        <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-slate-800 relative">
            <button id="auth-modal-close" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
                <i class="fas fa-xmark text-lg"></i>
            </button>
            
            <div id="auth-user-info" class="hidden text-center py-2">
                <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3 border border-slate-700">
                    <i class="fas fa-user-shield text-2xl text-red-400"></i>
                </div>
                <h3 class="text-lg font-bold text-white mb-1">Account Active</h3>
                <p id="user-email-display" class="text-sm text-slate-400 mb-6 font-mono"></p>
                <button id="btn-logout" class="w-full bg-slate-800 hover:bg-slate-700 text-red-400 border border-slate-700 font-bold py-3 rounded-xl transition-colors">
                    <i class="fas fa-right-from-bracket mr-2"></i> Sign Out
                </button>
            </div>

            <div id="auth-form-container">
                <div class="flex border-b border-slate-800 mb-5">
                    <button id="tab-login" class="flex-1 pb-3 text-center font-bold text-red-400 border-b-2 border-red-500">Sign In</button>
                    <button id="tab-register" class="flex-1 pb-3 text-center font-bold text-slate-500 hover:text-slate-300">Register</button>
                </div>

                <form id="auth-form" class="flex flex-col gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Email Address</label>
                        <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500" placeholder="adventurer@realm.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Password</label>
                        <input type="password" id="auth-password" required minlength="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500" placeholder="••••••••">
                    </div>

                    <button type="submit" id="auth-submit-btn" class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-3.5 rounded-xl mt-2 transition-all shadow-lg shadow-red-950/50">
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Add/Edit Item Modal -->
    <div id="item-modal" class="fixed inset-0 modal-overlay z-50 hidden flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4">
        <div class="bg-slate-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl border border-slate-800 max-h-[90vh] overflow-y-auto relative">
            <button id="modal-close" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2">
                <i class="fas fa-xmark text-lg"></i>
            </button>
            <h2 class="text-lg font-bold text-white mb-4" id="modal-title">Track New Item</h2>
            
            <form id="item-form" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Item or Creature Name</label>
                    <input type="text" id="input-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500" placeholder="e.g. Shield of Faith, Familiar...">
                </div>
                
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Current HP</label>
                        <input type="number" id="input-current-hp" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500" placeholder="0">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Max HP</label>
                        <input type="number" id="input-max-hp" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500" placeholder="0">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Accent Color</label>
                    <input type="color" id="input-color" value="#3b82f6" class="w-full h-10 rounded-xl cursor-pointer">
                </div>

                <!-- Properties Section -->
                <div class="border-t border-slate-800 pt-4 mt-1">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Item Properties</label>
                        <button type="button" id="btn-add-property" class="text-xs text-red-400 hover:text-red-300 font-bold flex items-center gap-1">
                            <i class="fas fa-plus"></i> Add Property
                        </button>
                    </div>

                    <div id="properties-editor-list" class="flex flex-col gap-2.5">
                        <!-- Dynamic property inputs will be rendered here -->
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-bold py-3.5 rounded-xl mt-3 transition-all shadow-lg shadow-red-950/50">
                    Save Item
                </button>
            </form>
        </div>
    </div>

    <!-- Property Popup Modal -->
    <div id="property-modal" class="fixed inset-0 modal-overlay z-[70] hidden flex flex-col justify-center items-center p-4">
        <div class="bg-slate-900 w-full max-w-xs rounded-2xl p-5 shadow-2xl border border-slate-800 relative transform transition-all">
            <button id="property-modal-close" class="absolute top-3 right-3 text-slate-400 hover:text-white p-1">
                <i class="fas fa-xmark text-lg"></i>
            </button>
            <div class="flex items-center gap-3 mb-3">
                <div id="prop-display-icon" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-red-400 text-lg">
                    <i class="fas fa-wand-magic-sparkles"></i>
                </div>
                <h3 id="prop-display-title" class="text-base font-bold text-white leading-snug">Property Title</h3>
            </div>
            <p id="prop-display-desc" class="text-sm text-slate-300 leading-relaxed bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                Property description snippet...
            </p>
        </div>
    </div>

    <!-- Amount Input Modal (For HP Quick Change) -->
    <div id="amount-modal" class="fixed inset-0 modal-overlay z-[60] hidden flex flex-col justify-center items-center p-4">
        <div class="bg-slate-900 w-full max-w-xs rounded-2xl p-6 shadow-2xl border border-slate-800">
            <h3 id="amount-modal-title" class="text-lg font-bold mb-4 text-white text-center">Modify HP</h3>
            <input type="number" id="amount-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 mb-5 text-center text-2xl font-bold" placeholder="0" min="1">
            <div class="flex gap-2.5">
                <button id="amount-cancel" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold transition-colors text-sm">Cancel</button>
                <button id="amount-confirm" class="flex-1 py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold transition-colors text-sm">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="error-toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-950 border border-red-800 text-red-200 px-4 py-2.5 rounded-xl shadow-xl z-50 hidden opacity-0 transition-opacity flex items-center gap-2 text-xs font-semibold">
        <i class="fas fa-triangle-exclamation text-red-400"></i>
        <span id="error-message"></span>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
